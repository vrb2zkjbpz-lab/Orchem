const K='yakdonghak-gate-pw';
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.normalize('NFC')),'PBKDF2',false,['deriveBits']);
  const raw=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(D.salt),iterations:D.it,hash:'SHA-256'},base,256);
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.iv)},key,b64(D.ct)));
  document.open();document.write(html);document.close();
}
const f=document.getElementById('f'),msg=document.getElementById('msg'),btn=document.getElementById('go');
f.onsubmit=async e=>{e.preventDefault();const pw=document.getElementById('pw').value;if(!pw)return;
  const rem=document.getElementById('rem').checked;btn.disabled=true;msg.textContent='';btn.textContent='여는 중…';
  try{await open_(pw);try{rem&&localStorage.setItem(K,pw)}catch(_){}}
  catch(err){btn.disabled=false;btn.textContent='열기';msg.textContent=window.crypto&&crypto.subtle?'비밀번호가 틀렸어요.':'이 브라우저에서는 열 수 없어요. Safari나 Chrome으로 열어 주세요.'}};
let saved=null;try{saved=localStorage.getItem(K)}catch(_){}
if(saved){btn.disabled=true;btn.textContent='여는 중…';open_(saved).catch(()=>{try{localStorage.removeItem(K)}catch(_){}btn.disabled=false;btn.textContent='열기'})}
</script></body></html>
